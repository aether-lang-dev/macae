# Runs ci.sh on a macOS runner: every module compiled and linked into one
# program, then each std.spec suite. Mac-only by nature (README, "Apple's
# terms"): the SDK comes from Xcode on the runner, never from this repo, so
# there is no Linux leg to run and none is pretended.
#
# The runner's login keychain accepts writes, so the keychain suite runs for
# real there (it skips on a headless VM over ssh). The GUI paths of
# workspace/quicklook are exercised only for their headless refusals, since
# ci.sh sets MACAE_HEADLESS. See AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # macOS keeps Homebrew out of clang's default library search path, and
      # `ae run` links libaether.a's transitive deps (-lssl -lcrypto -lz
      # -lnghttp2 -lpcre2-8). Same step as aether-ui's CI.
      - name: Make Homebrew's libraries linkable
        run: |
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Pinned so a new upstream release cannot change this pipeline's colour
      # on its own; bump deliberately. v0.717.0 was the first release carrying
      # fs.hard_link, which test_attrlist.ae uses. v0.766.0 (2026-10-03) is the
      # family-wide floor Paul set for every Aether repo; no macae source change
      # needed, ./ci.sh all green against it. A tag with no prebuilt
      # asset makes get.sh build from source, which is fine on this runner.
      - name: Install the Aether toolchain
        env:
          AETHER_REF: ${{ vars.AETHER_REF || 'v0.766.0' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version check
        run: ae --version

      - name: Run the pipeline
        run: ./ci.sh
